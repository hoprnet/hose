{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hose.fullname" . }}-allow-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  podSelector:
    matchLabels:
      {{- include "hose.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressOpentelemetry.namespace }}
          podSelector:
            matchLabels:
              {{- .Values.networkPolicy.ingressOpentelemetry.podSelector | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: grpc
{{- end }}
