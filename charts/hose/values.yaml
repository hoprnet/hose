# Default values for hose.
replicaCount: 1
image:
  repository: hopr/hose
  # Defaults to the chart appVersion if left empty
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Whether to create a ServiceAccount
  create: true
  # Annotations to add to the ServiceAccount
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""
# Annotations to add to the Deployment object itself
deploymentAnnotations: {}
# Labels to add to the Deployment object itself (not the pod template)
deploymentLabels: {}
podAnnotations: {}
podLabels: {}
service:
  type: ClusterIP
  grpcType: LoadBalancer
ingress:
  enabled: false
  className: ""
  annotations: {}
  grpcHostname: "hose-ingestor.local"
  hosts:
    - host: hose.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: hose-tls
  #    hosts:
  #      - hose.local
persistence:
  enabled: true
  size: 1Gi
  # Leave empty to use the cluster default StorageClass
  storageClass: ""
  accessModes:
    - ReadWriteOnce
# Application configuration — mapped to environment variables via ConfigMap
config:
  grpcListen: "0.0.0.0:4317"
  httpListen: "0.0.0.0:8080"
  databasePath: "/data/hose.db"
  retentionHours: "24"
  writeBufferSize: "1000"
  writeBufferFlushSecs: "5"
  # Optional: HOPR indexer GraphQL endpoint
  indexerEndpoint: ""
  rustLog: "info"
# Additional environment variables (e.g. from Secrets)
extraEnv: []
# - name: MY_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password

# Additional envFrom sources
extraEnvFrom: []
# - secretRef:
#     name: my-secret

podSecurityContext: {}
# fsGroup: 1000

securityContext: {}
# runAsNonRoot: true
# runAsUser: 1000
# readOnlyRootFilesystem: true

resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   cpu: 500m
#   memory: 512Mi

readinessProbe:
  httpGet:
    path: /readyz
    port: web
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /livez
    port: web
  initialDelaySeconds: 10
  periodSeconds: 20
nodeSelector: {}
tolerations: []
affinity: {}
networkPolicy:
  # Whether to create the NetworkPolicy allowing ingress from the opentelemetry collector.
  # A no-op unless the hose namespace has already opted into the deny-all baseline.
  enabled: false
  ingressOpentelemetry:
    namespace: opentelemetry
    podSelector:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: opentelemetry.opentelemetry-kube-stack-hoprnet
  # Ingress allowed towards the "web" port (the chart's own http Ingress, ingress.yaml) -
  # set to null/{} to drop the rule if something other than nginx-internal fronts it.
  ingressWeb:
    namespace: ingress-nginx
    podSelector:
      app.kubernetes.io/instance: nginx-internal
      app.kubernetes.io/component: controller
  # Ingress allowed towards the gRPC port when service.grpcType is LoadBalancer.
  # Each entry is a NetworkPolicy ipBlock: a `cidr` plus an optional `except` list.
  # Set to an empty list to drop the rule entirely.
  ingressLoadBalancer:
    ipBlocks:
      - cidr: 0.0.0.0/0
    # - cidr: 10.0.0.0/8
    #   except:
    #     - 10.10.0.0/16
