{% extends "base.html" %} {% block title %}Channel Graph - HOSE{% endblock %} {%
block content %}
<h1>Channel Graph</h1>
<p class="subtitle">
  Blokli channel table. Filter by peer ID, packet-key hex, or account key ID.
</p>

<div class="section channel-graph-controls">
  <div class="channel-graph-controls-row">
    <label for="peer-ids-input">Filter Terms</label>
    <textarea
      id="peer-ids-input"
      rows="3"
      placeholder="12D3KooW...&#10;0x361feaaeda...&#10;42"
    ></textarea>
  </div>
  <div class="channel-graph-controls-row">
    <label for="filter-mode-select">Filter Mode</label>
    <select id="filter-mode-select">
      <option value="any" selected>Any endpoint matches</option>
      <option value="both">Both endpoints match</option>
    </select>
    <label for="endpoint-display-select">Endpoint View</label>
    <select id="endpoint-display-select">
      <option value="key_id" selected>Key ID</option>
      <option value="chain_key">Chain Key</option>
      <option value="packet_key">Packet Key</option>
      <option value="peer_id">Peer ID</option>
    </select>
    <button id="refresh-channels-btn" type="button">Refresh</button>
  </div>
  <div id="channel-graph-status" class="sse-status">Ready.</div>
</div>

<div class="section">
  <table>
    <thead>
      <tr>
        <th>
          <button
            id="sort-id"
            type="button"
            class="sort-btn"
            data-sort-key="id"
          >
            Channel ID
          </button>
        </th>
        <th>
          <button
            id="sort-source"
            type="button"
            class="sort-btn"
            data-sort-key="source"
          >
            Source
          </button>
        </th>
        <th>
          <button
            id="sort-destination"
            type="button"
            class="sort-btn"
            data-sort-key="destination"
          >
            Destination
          </button>
        </th>
        <th>
          <button
            id="sort-status"
            type="button"
            class="sort-btn"
            data-sort-key="status"
          >
            Status
          </button>
        </th>
        <th>
          <button
            id="sort-balance"
            type="button"
            class="sort-btn"
            data-sort-key="balance"
          >
            Balance
          </button>
        </th>
        <th>
          <button
            id="sort-epoch"
            type="button"
            class="sort-btn"
            data-sort-key="channel_epoch"
          >
            Epoch
          </button>
        </th>
        <th>
          <button
            id="sort-ticket-index"
            type="button"
            class="sort-btn"
            data-sort-key="ticket_index"
          >
            Ticket Index
          </button>
        </th>
        <th>
          <button
            id="sort-closure-time"
            type="button"
            class="sort-btn"
            data-sort-key="closure_time"
          >
            Closure Time
          </button>
        </th>
      </tr>
    </thead>
    <tbody id="channel-graph-body"></tbody>
  </table>
  <div id="channel-graph-empty" class="empty">No channels loaded yet.</div>
</div>
{% endblock %} {% block scripts %}
<script type="module" src="/static/js/ChannelGraph.mjs"></script>
{% endblock %}
