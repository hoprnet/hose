name: Merge
on:
  pull_request:
    types:
      - closed
      # - synchronize
    branches:
      - main
permissions: {}
concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
jobs:
  build-docker:
    name: Docker
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # build-docker-v4.0.0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.merge_commit_sha }}
      version_type: pr
      build_matrix: |-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-hose-x86_64-linux"
          }
        ]
      cachix_cache_name: hose
      docker_image_name: hose
      docker_image_format: skopeo
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
