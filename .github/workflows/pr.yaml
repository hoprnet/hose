name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 from 19.03.2026
      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      - name: Setup cachix cache
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17 from 19.03.2026
        env:
          USER: runner
        with:
          name: hose
      - name: Check formatting
        run: nix develop -c treefmt --fail-on-change
      - name: Run clippy
        run: nix develop -c cargo clippy -- -D warnings
  test:
    name: Test
    needs: [lint]
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 from 19.03.2026
      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
      - name: Setup cachix cache
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17 from 19.03.2026
        env:
          USER: runner
        with:
          name: hose
      - name: Run tests
        run: nix develop -c cargo test
  build-docker:
    name: Docker
    needs: [lint, test]
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@5be6fbca6ea8b13afa4d111724ff83c78456d13e # 0.9.3
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      concurrency_group_suffix: ${{ github.event.pull_request.number || github.ref_name }}
      build_matrix: |-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-hose-x86_64-linux"
          }
        ]
      cachix_cache_name: hose
      docker_image_name: hose
      docker_image_format: skopeo
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Single aggregate merge gate: green only if every other job succeeded.
  # Mark THIS one required check in the branch ruleset, so adding, renaming
  # or removing a job never needs a ruleset change. `if: always()` runs it
  # even when a dependency fails; alls-green then fails on any non-success.
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - lint
      - test
      - build-docker
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: All jobs pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
